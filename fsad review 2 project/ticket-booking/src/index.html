<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Color Palette App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Simple Color Palette App</h1>

    <input type="text" id="colorInput" placeholder="Enter a color name" />

    <div class="button-group">
      <button id="bgBtn">Change Background</button>
      <button id="textBtn">Change Text Color</button>
    </div>

    <p id="displayText">Welcome to the Color Palette App</p>
  </div>

  <script src="Process.js"></script>
</body>
</html>
