  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
  padding: 40px 20px;
  color: white;
}

.history-header {
  max-width: 1200px;
  margin: 0 auto 40px;
  text-align: center;
}

.history-header h1 {
  font-size: 2.5rem;
  margin: 0 0 10px 0;
  color: #e94560;
}

.header-subtitle {
  font-size: 1.1rem;
  color: rgba(255, 255, 255, 0.7);
  margin: 0 0 25px 0;
}

.btn-back {
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.1);
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
}

.btn-back:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
}

.error-msg {
  max-width: 1200px;
  margin: 0 auto 20px;
  background: rgba(233, 69, 96, 0.1);
  color: #ff6b6b;
  padding: 15px 20px;
  border-radius: 8px;
  border-left: 4px solid #e94560;
}

.empty-state {
  max-width: 500px;
  margin: 80px auto;
  text-align: center;
  padding: 60px 40px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(233, 69, 96, 0.3);
  border-radius: 16px;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.empty-icon {
  font-size: 4rem;
  margin-bottom: 20px;
}

.empty-state h2 {
  font-size: 1.8rem;
  margin: 0 0 15px 0;
  color: rgba(255, 255, 255, 0.9);
}

.empty-state p {
  color: rgba(255, 255, 255, 0.6);
  margin: 0 0 25px 0;
  font-size: 1rem;
  line-height: 1.6;
}

.btn-explore {
  padding: 12px 30px;
  background: linear-gradient(135deg, #e94560, #c73652);
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-explore:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
}

.loading-spinner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 20px;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 255, 255, 0.1);
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.bookings-grid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 25px;
  animation: fadeIn 0.5s ease;
}

@media (max-width: 768px) {
  .bookings-grid {
    grid-template-columns: 1fr;
  }
}

.booking-card {
  background: #16213e;
  border: 1px solid rgba(233, 69, 96, 0.3);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  transition: all 0.3s;
  display: flex;
  flex-direction: column;
}

.booking-card:hover {
  transform: translateY(-5px);
  border-color: #e94560;
  box-shadow: 0 15px 40px rgba(233, 69, 96, 0.2);
}

.card-header {
  padding: 20px;
  background: linear-gradient(135deg, rgba(233, 69, 96, 0.15), rgba(15, 52, 96, 0.15));
  border-bottom: 1px solid rgba(233, 69, 96, 0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header h3 {
  margin: 0;
  color: #e94560;
  font-size: 1.3rem;
  flex: 1 1;
}

.badge-paid {
  background: rgba(16, 185, 129, 0.2);
  color: #10b981;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.badge-pending {
  background: rgba(245, 158, 11, 0.2);
  color: #f59e0b;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.card-body {
  padding: 20px;
  flex: 1 1;
}

.booking-info {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 0.95rem;
}

.info-row:last-child {
  border-bottom: none;
}

.info-row.amount {
  background: rgba(233, 69, 96, 0.1);
  padding: 12px;
  border-radius: 8px;
  border-bottom: none;
  font-weight: 600;
  font-size: 1rem;
}

.info-row.code {
  background: rgba(100, 150, 200, 0.1);
  padding: 12px;
  border-radius: 8px;
  border-bottom: none;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.info-row .label {
  color: rgba(255, 255, 255, 0.6);
  font-weight: 500;
  font-size: 0.9rem;
}

.info-row .value {
  color: rgba(255, 255, 255, 0.9);
  font-weight: 600;
  text-align: right;
}

.info-row.code .value {
  text-align: left;
  width: 100%;
}

.code-text {
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  color: #e94560;
  background: rgba(0, 0, 0, 0.2);
  padding: 8px 12px;
  border-radius: 6px;
  width: 100%;
  text-align: center;
}

.card-footer {
  padding: 15px 20px;
  background: rgba(255, 255, 255, 0.03);
  border-top: 1px solid rgba(233, 69, 96, 0.2);
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-indicator {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

.status-text {
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.9rem;
  flex: 1 1;
}

.history-footer {
  max-width: 1200px;
  margin: 60px auto 0;
  text-align: center;
  padding-top: 30px;
  border-top: 1px solid rgba(233, 69, 96, 0.2);
}

.footer-text {
  color: rgba(255, 255, 255, 0.6);
  font-size: 0.95rem;
  margin: 0;
}

@media (max-width: 600px) {
  .history-container {
    padding: 20px 15px;
  }

  .history-header h1 {
    font-size: 1.8rem;
  }

  .card-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .info-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .info-row .value {
    text-align: left;
  }
}

}

.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(233,69,96,0.1) 0%, transparent 60%);
  animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.hero-content { position: relative; z-index: 1; }

.hero h1 {
  font-size: 3rem;
  font-weight: 800;
  margin-bottom: 15px;
  background: linear-gradient(90deg, #fff, #e94560);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p { font-size: 1.2rem; color: rgba(255,255,255,0.8); margin-bottom: 30px; }

.search-bar input {
  width: 500px;
  max-width: 90%;
  padding: 15px 25px;
  border-radius: 50px;
  border: 2px solid rgba(233,69,96,0.5);
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 1rem;
  outline: none;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.search-bar input::placeholder { color: rgba(255,255,255,0.6); }
.search-bar input:focus { border-color: #e94560; background: rgba(255,255,255,0.15); }

.section { padding: 40px; }

.section-title {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 25px;
  color: white;
}

/* Top Events Horizontal Scroll */
.top-events-scroll {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding-bottom: 15px;
  scrollbar-width: thin;
  scrollbar-color: #e94560 #1a1a2e;
}

.top-events-scroll::-webkit-scrollbar { height: 6px; }
.top-events-scroll::-webkit-scrollbar-track { background: #1a1a2e; }
.top-events-scroll::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

.top-event-card {
  min-width: 320px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 16px;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: all 0.3s;
  cursor: pointer;
}

.top-event-card:hover {
  border-color: #e94560;
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(233,69,96,0.2);
}

.top-event-icon { font-size: 2.5rem; }

.top-event-info h3 { font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 5px; }
.top-event-info p { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin: 2px 0; }
.top-event-price { color: #e94560 !important; font-weight: 700 !important; font-size: 1rem !important; }

.top-event-card button {
  padding: 10px 20px;
  background: #e94560;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.3s;
  margin-top: 5px;
}

.top-event-card button:hover { background: #c73652; }

/* Filter Bar */
.filter-bar {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.filter-bar button {
  padding: 10px 25px;
  border-radius: 50px;
  border: 2px solid rgba(233,69,96,0.4);
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s;
}

.filter-bar button:hover { border-color: #e94560; color: white; }
.filter-bar button.active { background: #e94560; border-color: #e94560; color: white; font-weight: 700; }

/* Events Grid */
.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 25px;
}

.event-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.2);
  border-radius: 16px;
  padding: 25px;
  transition: all 0.3s;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.event-card:hover {
  border-color: #e94560;
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(233,69,96,0.15);
}

.event-card-header { display: flex; justify-content: space-between; align-items: center; }
.event-icon { font-size: 2rem; }

.event-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}

.event-badge.internal { background: rgba(99,179,237,0.2); color: #63b3ed; }
.event-badge.external { background: rgba(154,117,234,0.2); color: #9a75ea; }

.event-card h3 { font-size: 1.15rem; font-weight: 700; color: white; }
.event-desc { color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.5; }

.event-meta { display: flex; flex-direction: column; gap: 5px; }
.event-meta span { color: rgba(255,255,255,0.7); font-size: 0.82rem; }

.event-pricing { display: flex; gap: 10px; flex-wrap: wrap; }

.price-tag {
  padding: 4px 12px;
  background: rgba(233,69,96,0.15);
  color: #e94560;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
  border: 1px solid rgba(233,69,96,0.3);
}

.price-tag.vip {
  background: rgba(255,215,0,0.15);
  color: #ffd700;
  border-color: rgba(255,215,0,0.3);
}

.btn-book {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: auto;
}

.btn-book:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(233,69,96,0.4); }

.btn-disabled {
  width: 100%;
  padding: 12px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: not-allowed;
  margin-top: auto;
}

  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
  padding: 40px 20px;
  color: white;
}

.booking-step {
  max-width: 900px;
  margin: 0 auto;
  background: #16213e;
  border: 1px solid rgba(233, 69, 96, 0.3);
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  animation: slideIn 0.5s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.step-header {
  text-align: center;
  margin-bottom: 40px;
  border-bottom: 2px solid rgba(233, 69, 96, 0.3);
  padding-bottom: 20px;
}

.step-header h2 {
  font-size: 2rem;
  margin: 0 0 10px 0;
  color: #e94560;
}

.event-title {
  font-size: 1.3rem;
  color: rgba(255, 255, 255, 0.8);
  margin: 0;
}

.error-msg {
  background: rgba(233, 69, 96, 0.1);
  color: #ff6b6b;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  border-left: 4px solid #e94560;
}

form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 600px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
  font-size: 0.95rem;
}

.form-group input,
.form-group select {
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1.5px solid rgba(233, 69, 96, 0.3);
  border-radius: 10px;
  color: white;
  font-size: 1rem;
  outline: none;
  transition: all 0.3s;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #e94560;
  background: rgba(233, 69, 96, 0.1);
  box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
}

.amount-display {
  background: rgba(233, 69, 96, 0.1);
  padding: 20px;
  border-radius: 12px;
  border-left: 4px solid #e94560;
  text-align: center;
}

.amount-display h3 {
  margin: 0 0 10px 0;
  font-size: 1.5rem;
}

.amount {
  color: #e94560;
  font-size: 2rem;
  font-weight: 700;
}

.available-seats {
  margin: 0;
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.9rem;
}

.payment-card {
  background: linear-gradient(135deg, rgba(233, 69, 96, 0.1), rgba(15, 52, 96, 0.1));
  border: 1.5px solid rgba(233, 69, 96, 0.3);
  padding: 30px;
  border-radius: 16px;
  text-align: center;
}

.payment-info {
  background: rgba(255, 255, 255, 0.05);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 30px;
  text-align: left;
}

.payment-info p {
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.qr-section {
  margin: 30px 0;
}

.qr-label {
  margin: 0 0 15px 0;
  font-size: 1.1rem;
  color: rgba(255, 255, 255, 0.9);
}

.qr-display {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 30px 0;
  padding: 30px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.qr-image {
  width: 250px;
  height: 250px;
  border-radius: 8px;
  border: 3px solid #e94560;
}

.qr-instruction {
  margin-top: 15px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 0.9rem;
}

.upi-text {
  color: #e94560;
  font-weight: 700;
  margin-top: 20px;
  font-size: 1.2rem;
  text-align: center;
}

.payment-actions {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-paid {
  flex: 1 1;
  min-width: 200px;
  padding: 14px 28px;
  background: linear-gradient(135deg, #e94560, #c73652);
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-paid:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
}

.btn-paid:active {
  transform: translateY(0);
}

.btn-secondary {
  flex: 1 1;
  min-width: 150px;
  padding: 14px 28px;
  background: rgba(255, 255, 255, 0.1);
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  color: white;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.3);
}

.ticket-container {
  margin: 30px 0;
}

.ticket {
  display: grid;
  grid-template-columns: 2fr 1fr;
  background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
  color: #1a1a2e;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  border: 2px dashed #e94560;
}

.ticket-left {
  padding: 30px;
  border-right: 2px dashed #e94560;
}

.ticket-right {
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
}

.ticket-event h1 {
  margin: 0 0 15px 0;
  font-size: 1.8rem;
  color: #e94560;
}

.ticket-date,
.ticket-venue {
  margin: 8px 0;
  font-size: 1rem;
  color: #555;
}

.ticket-details {
  margin-top: 30px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  font-size: 0.95rem;
}

.detail-row span {
  color: #666;
  font-weight: 500;
}

.detail-row strong {
  color: #1a1a2e;
  font-weight: 700;
}

.detail-row.amount {
  background: rgba(233, 69, 96, 0.1);
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 1.1rem;
}

.verify-code-label {
  margin: 0 0 10px 0;
  font-size: 0.85rem;
  color: #666;
  text-transform: uppercase;
  font-weight: 600;
}

.verify-code {
  background: #1a1a2e;
  color: #e94560;
  padding: 12px;
  border-radius: 8px;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 20px;
  font-family: 'Courier New', monospace;
}

.ticket-right canvas {
  margin: 15px 0;
  background: white;
  padding: 10px;
  border-radius: 8px;
}

.ticket-footer {
  margin: 10px 0 0 0;
  font-size: 0.8rem;
  color: #888;
  text-transform: uppercase;
}

.btn-primary,
.btn-download,
.btn-home {
  padding: 14px 28px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 200px;
}

.btn-primary {
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  width: 100%;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.ticket-actions {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 30px;
  flex-wrap: wrap;
}

.btn-download {
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
}

.btn-download:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
}

.btn-home {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: 1.5px solid rgba(255, 255, 255, 0.2);
}

.btn-home:hover {
  background: rgba(255, 255, 255, 0.15);
}

.loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.5rem;
}

@media (max-width: 700px) {
  .booking-step {
    padding: 25px;
  }

  .ticket {
    grid-template-columns: 1fr;
  }

  .ticket-left {
    border-right: none;
    border-bottom: 2px dashed #e94560;
  }

  .step-header h2 {
    font-size: 1.5rem;
  }

  .qr-display {
    padding: 20px;
  }

  .qr-image {
    width: 200px;
    height: 200px;
  }
}

  min-height: 100vh;
  background: #0f0f1a;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.confirmation-wrapper {
  width: 100%;
  max-width: 750px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.success-banner {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 20px;
}

.success-icon { font-size: 4rem; margin-bottom: 10px; }

.success-banner h1 {
  font-size: 2.5rem;
  font-weight: 800;
  color: white;
  margin-bottom: 10px;
}

.success-banner p { color: rgba(255,255,255,0.6); font-size: 1rem; }

.ticket-wrapper {
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.ticket {
  display: flex;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 20px;
  overflow: hidden;
  min-height: 350px;
}

.ticket-left {
  flex: 1 1;
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.ticket-event-name {
  font-size: 1.5rem;
  font-weight: 800;
  color: #e94560;
  border-bottom: 1px solid rgba(233,69,96,0.2);
  padding-bottom: 15px;
}

.ticket-details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.ticket-detail { display: flex; flex-direction: column; gap: 3px; }

.detail-label {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.detail-value {
  font-size: 0.9rem;
  color: white;
  font-weight: 600;
}

.detail-value.amount { color: #e94560; font-size: 1.1rem; }

.verification-code {
  background: rgba(233,69,96,0.1);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 10px;
  padding: 10px 15px;
  color: rgba(255,255,255,0.8);
  font-size: 0.85rem;
}

.verification-code strong { color: #e94560; letter-spacing: 2px; }

.ticket-divider {
  width: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  background: #0f0f1a;
}

.circle {
  width: 20px;
  height: 20px;
  background: #0f0f1a;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.circle.top { top: -10px; }
.circle.bottom { bottom: -10px; }

.dashes {
  flex: 1 1;
  border-left: 2px dashed rgba(233,69,96,0.3);
  margin: 15px 0;
}

.ticket-right {
  width: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: rgba(255,255,255,0.02);
}

.ticket-qr {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.ticket-qr p {
  color: rgba(255,255,255,0.5);
  font-size: 0.75rem;
  text-align: center;
}

.ticket-qr svg {
  border-radius: 10px;
  padding: 8px;
  background: white;
}

.confirmation-actions {
  display: flex;
  gap: 15px;
  justify-content: center;
}

.btn-download {
  padding: 15px 30px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-download:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(233,69,96,0.4);
}

.btn-home {
  padding: 15px 30px;
  background: transparent;
  color: white;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-home:hover {
  border-color: #e94560;
  color: #e94560;
}

.loading {
  min-height: 100vh;
  background: #0f0f1a;
  display: flex;
  justify-content: center;
  align-items: center;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(233,69,96,0.2);
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

  min-height: 100vh;
  background: #0f0f1a;
  padding: 30px 40px;
  color: white;
}

.admin-header { margin-bottom: 30px; }

.admin-header h1 {
  font-size: 2rem;
  font-weight: 800;
  color: white;
  margin-bottom: 25px;
}

.admin-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 10px;
}

.stat-card {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 16px;
  padding: 20px 25px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  transition: all 0.3s;
}

.stat-card:hover {
  border-color: #e94560;
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(233,69,96,0.15);
}

.stat-num {
  font-size: 2rem;
  font-weight: 800;
  color: #e94560;
}

.stat-label {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.admin-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.admin-tabs button {
  padding: 10px 22px;
  border-radius: 50px;
  border: 2px solid rgba(233,69,96,0.3);
  background: transparent;
  color: rgba(255,255,255,0.6);
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.3s;
}

.admin-tabs button:hover { border-color: #e94560; color: white; }
.admin-tabs button.active { background: #e94560; border-color: #e94560; color: white; font-weight: 700; }

.admin-section {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(233,69,96,0.2);
  border-radius: 16px;
  padding: 25px;
}

.table-wrapper { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

thead { background: rgba(233,69,96,0.1); }

thead th {
  padding: 12px 15px;
  text-align: left;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 0.75rem;
  border-bottom: 1px solid rgba(233,69,96,0.2);
}

tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
tbody tr:hover { background: rgba(255,255,255,0.03); }
tbody td { padding: 12px 15px; color: rgba(255,255,255,0.8); }

.badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}

.badge.paid { background: rgba(72,187,120,0.2); color: #48bb78; }
.badge.pending { background: rgba(237,137,54,0.2); color: #ed8936; }
.badge.vip { background: rgba(255,215,0,0.2); color: #ffd700; }
.badge.general { background: rgba(99,179,237,0.2); color: #63b3ed; }
.badge.internal { background: rgba(99,179,237,0.2); color: #63b3ed; }
.badge.external { background: rgba(154,117,234,0.2); color: #9a75ea; }

code {
  background: rgba(233,69,96,0.1);
  color: #e94560;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 0.8rem;
  letter-spacing: 1px;
}

.btn-edit {
  padding: 5px 12px;
  background: rgba(99,179,237,0.2);
  color: #63b3ed;
  border: 1px solid rgba(99,179,237,0.3);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  margin-right: 5px;
  transition: all 0.2s;
}

.btn-edit:hover { background: rgba(99,179,237,0.4); }

.btn-delete {
  padding: 5px 12px;
  background: rgba(233,69,96,0.2);
  color: #e94560;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}

.btn-delete:hover { background: rgba(233,69,96,0.4); }

.add-event-form, .upi-form {
  max-width: 700px;
  margin: 0 auto;
}

.add-event-form h3, .upi-form h3 {
  font-size: 1.3rem;
  font-weight: 700;
  color: white;
  margin-bottom: 25px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 18px;
}

.form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }

.form-group label {
  color: rgba(255,255,255,0.6);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.form-group input,
.form-group select,
.form-group textarea {
  padding: 12px 15px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: white;
  font-size: 0.9rem;
  outline: none;
  transition: all 0.3s;
  font-family: inherit;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: #e94560; background: rgba(233,69,96,0.05); }

.form-group select option { background: #1a1a2e; }

.btn-primary {
  padding: 13px 30px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(233,69,96,0.3); }

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  backdrop-filter: blur(5px);
}

.modal {
  background: #1a1a2e;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 20px;
  padding: 35px;
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h3 {
  font-size: 1.3rem;
  font-weight: 700;
  color: white;
  margin-bottom: 25px;
}

.modal-actions { display: flex; gap: 15px; margin-top: 20px; }

.btn-save {
  padding: 12px 25px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-cancel {
  padding: 12px 25px;
  background: transparent;
  color: rgba(255,255,255,0.6);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-cancel:hover { border-color: #e94560; color: #e94560; }

  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e, #e94560);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.auth-container {
  background: #1a1a2e;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

.auth-container h2 {
  color: white;
  margin-bottom: 25px;
  text-align: center;
  font-size: 1.8rem;
}

.form-group { margin-bottom: 18px; }

.form-group label {
  display: block;
  margin-bottom: 6px;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
  font-size: 0.85rem;
}

.form-group input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
  transition: border 0.3s;
  box-sizing: border-box;
  background: #16213e !important;
  color: white !important;
  -webkit-text-fill-color: white !important;
}

.form-group input:focus { border-color: #e94560; background: rgba(233,69,96,0.1); }

.auth-container button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
  font-weight: 700;
}

.auth-container button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233,69,96,0.4); }

.auth-link {
  text-align: center;
  margin-top: 15px;
  color: rgba(255,255,255,0.6);
  font-size: 0.9rem;
}

.auth-link a { color: #e94560; font-weight: 600; }

.error-msg {
  background: rgba(233,69,96,0.1);
  color: #e94560;
  border: 1px solid rgba(233,69,96,0.3);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
  text-align: center;
  font-size: 0.9rem;

  background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  border-bottom: 2px solid rgba(233, 69, 96, 0.3);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar-brand {
  font-size: 1.5rem;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.navbar-brand:hover {
  color: #e94560;
  transform: scale(1.05);
}

.navbar-links {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.navbar-links span {
  color: rgba(255, 255, 255, 0.8);
  font-weight: 600;
  font-size: 0.95rem;
}

.navbar-links a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 6px;
  transition: all 0.3s;
  background: transparent;
  border: 1.5px solid rgba(233, 69, 96, 0.3);
  cursor: pointer;
  font-size: 0.95rem;
}

.navbar-links a:hover {
  background: rgba(233, 69, 96, 0.2);
  border-color: #e94560;
  color: #e94560;
}

.nav-button {
  padding: 8px 16px;
  background: transparent;
  border: 1.5px solid rgba(233, 69, 96, 0.5);
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  font-size: 0.9rem;
  outline: none;
}

.nav-button:hover {
  background: rgba(233, 69, 96, 0.2);
  border-color: #e94560;
  color: #e94560;
  transform: translateY(-2px);
}

.nav-button:active {
  transform: translateY(0);
}

.nav-button.logout {
  border-color: rgba(255, 100, 100, 0.5);
  color: #ff6464;
}

.nav-button.logout:hover {
  background: rgba(255, 100, 100, 0.1);
  border-color: #ff6464;
  color: #ff6464;
}

/* Responsive Design */
@media (max-width: 768px) {
  .navbar {
    padding: 12px 15px;
    flex-wrap: wrap;
    justify-content: flex-start;
  }

  .navbar-brand {
    font-size: 1.2rem;
    width: 100%;
    margin-bottom: 10px;
  }

  .navbar-links {
    width: 100%;
    gap: 10px;
    justify-content: flex-start;
  }

  .navbar-links a,
  .nav-button {
    padding: 6px 12px;
    font-size: 0.85rem;
  }

  .navbar-links span {
    font-size: 0.85rem;
  }
}

@media (max-width: 480px) {
  .navbar {
    padding: 10px 10px;
  }

  .navbar-brand {
    font-size: 1rem;
  }

  .navbar-links {
    gap: 8px;
  }

  .navbar-links a,
  .nav-button {
    padding: 5px 10px;
    font-size: 0.8rem;
  }
}

  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e, #e94560);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.auth-container {
  background: #1a1a2e;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  text-align: center;
}

.otp-icon { font-size: 3rem; margin-bottom: 15px; }

.auth-container h2 { color: white; margin-bottom: 10px; font-size: 1.8rem; }

.otp-subtitle { color: rgba(255,255,255,0.6); margin-bottom: 25px; line-height: 1.6; }
.otp-subtitle strong { color: #e94560; }

.otp-inputs input {
  width: 100%;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(233,69,96,0.3);
  border-radius: 10px;
  color: white;
  font-size: 1.5rem;
  text-align: center;
  letter-spacing: 8px;
  outline: none;
  margin-bottom: 20px;
  box-sizing: border-box;
  transition: border 0.3s;
}

.otp-inputs input:focus { border-color: #e94560; }

.auth-container button {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #e94560, #c73652);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}

.auth-container button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233,69,96,0.4); }
.auth-container button:disabled { opacity: 0.7; cursor: not-allowed; }

.auth-link { margin-top: 20px; color: rgba(255,255,255,0.6); font-size: 0.9rem; }

.error-msg {
  background: rgba(233,69,96,0.1);
  color: #e94560;
  border: 1px solid rgba(233,69,96,0.3);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 0.9rem;
}

  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 9999;
}

.chatbot-toggle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e94560, #c73652);
  border: none;
  color: white;
  font-size: 1.6rem;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(233,69,96,0.5);
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chatbot-toggle:hover { transform: scale(1.1); }

.chatbot-box {
  position: absolute;
  bottom: 75px;
  right: 0;
  width: 340px;
  height: 480px;
  background: #1a1a2e;
  border: 1px solid rgba(233,69,96,0.3);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.chatbot-header {
  background: linear-gradient(135deg, #e94560, #c73652);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  font-weight: 700;
  font-size: 1rem;
}

.chatbot-header button {
  background: none;
  border: none;
  color: white;
  font-size: 1rem;
  cursor: pointer;
}

.chatbot-messages {
  flex: 1 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scrollbar-width: thin;
  scrollbar-color: #e94560 #1a1a2e;
}

.msg { display: flex; align-items: flex-end; gap: 8px; }
.msg.user { flex-direction: row-reverse; }

.bot-icon { font-size: 1.2rem; flex-shrink: 0; }

.msg-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.88rem;
  line-height: 1.5;
  word-wrap: break-word;
}

.msg.bot .msg-bubble {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.9);
  border-bottom-left-radius: 3px;
}

.msg.user .msg-bubble {
  background: #e94560;
  color: white;
  border-bottom-right-radius: 3px;
}

.typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
.typing span {
  width: 8px; height: 8px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: bounce 1s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.chatbot-input {
  padding: 12px 15px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  gap: 10px;
}

.chatbot-input input {
  flex: 1 1;
  padding: 10px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: white;
  font-size: 0.88rem;
  outline: none;
  transition: border 0.3s;
}

.chatbot-input input:focus { border-color: #e94560; }

.chatbot-input button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #e94560;
  border: none;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}
